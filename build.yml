name: Build Aetherium URW Shader Bridge

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Minecraft 26.3 Fabric
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-provider: basic

      - name: Build mod
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify JAR and metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/libs/aetherium-urw-bridge-26.3-0.2.0.jar'
          test -f "$JAR"
          jar tf "$JAR" > "$RUNNER_TEMP/jar-contents.txt"
          grep -Fxq 'fabric.mod.json' "$RUNNER_TEMP/jar-contents.txt"
          grep -Fxq 'aetherium-urw-bridge.client.mixins.json' "$RUNNER_TEMP/jar-contents.txt"
          python3 - "$JAR" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              metadata = json.loads(jar.read('fabric.mod.json').decode('utf-8'))
          assert metadata['id'] == 'aetherium_urw_bridge', metadata
          assert metadata['version'] == '0.2.0', metadata
          print('JAR structure and metadata verified.')
          PY

      - name: Upload bridge JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/aetherium-urw-bridge-26.3-0.2.0.jar
          archive: false
          if-no-files-found: error
          retention-days: 14
